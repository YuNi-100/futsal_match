[project]
name = "wgh-futsal-match"
version = "1.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.15.1",
    "click==8.5.0",
    "fastapi==0.143.0",
    "h11==0.16.0",
    "idna==3.20",
    "opentelemetry-api==1.45.1",
    "pydantic==2.14.1",
    "pydantic_core==2.50.1",
    "PyMySQL==1.2.3",
    "python-dotenv==1.2.4",
    "starlette==1.7.0",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
    "uvicorn==0.54.0",
    "google-auth[requests]>=2.38,<3",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.20,<1",
    "google-genai>=1,<3",
    "openai>=1,<3",
    "psycopg[binary]>=3.2,<4",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python build_vercel.py"

[tool.vercel.fastapi.static]
cdn = false
exclude = false
